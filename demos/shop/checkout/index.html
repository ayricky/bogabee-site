<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Bogabee Apiaries</title>
    <meta name="description" content="Pay for your Bogabee honey: porch pickup in Manalapan, local delivery or shipping.">
    <meta name="robots" content="noindex">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Checkout · Bogabee Apiaries">
    <meta property="og:description" content="Raw wildflower honey from Manalapan, NJ.">
    <meta property="og:image" content="/demos/assets/og.jpg">
    <link rel="icon" type="image/png" href="../../assets/favicon-32.png">
    <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Jost:wght@400..600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../brand.css">
    <link rel="stylesheet" href="../shop.css">
    <style>
        .optin { display: flex; align-items: flex-start; gap: 10px; margin-top: 16px; font-size: 15px; color: var(--muted); cursor: pointer; }
        .optin input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--brown); flex: none; }
    </style>
</head>
<body>
    <header class="nav is-solid">
        <div class="wrap">
            <a class="brand" href="../../refined/" data-home aria-label="Bogabee Apiaries"><img src="../../assets/img/logo-96.webp" alt="" width="42" height="42"><span>Bogabee Apiaries</span></a>
            <nav class="links" aria-label="Site">
                <a href="../../apiary/">The Apiary</a>
                <a href="../../journal/">Journal</a>
                <a href="../../refined/#order" data-home-shop>Shop the jars</a>
            </nav>
        </div>
    </header>

    <main class="page">
        <div class="wrap">
            <div class="page-head">
                <span class="eyebrow">Checkout</span>
                <h1 class="display" id="page-title">Almost yours.</h1>
            </div>

            <div class="empty-cart card" hidden>
                <div class="card-body">
                    <a class="btn" href="../../refined/#order" data-home-shop>Shop the jars</a>
                </div>
            </div>

            <p class="notice" id="stock-notice" role="alert" tabindex="-1" hidden></p>

            <form class="checkout" id="checkout" novalidate hidden>
                <div>
                    <section class="card" aria-labelledby="h-delivery">
                        <div class="card-body">
                            <h2 id="h-delivery">Delivery</h2>
                            <div class="choices" id="fulfillment"></div>

                            <div id="porch-fields" class="porch-fields">
                                <p class="field" style="margin: 22px 0 10px"><label id="day-label">Pickup day</label></p>
                                <div class="days" role="radiogroup" aria-labelledby="day-label" id="days"></div>
                                <div class="fields" style="margin-top: 14px">
                                    <div class="field">
                                        <label for="hour">Pickup time</label>
                                        <select id="hour" name="hour"></select>
                                    </div>
                                    <p class="field" style="align-self: end; margin: 0 0 12px; color: var(--muted); font-size: 14px" id="window-text"></p>
                                </div>
                            </div>

                            <div id="address-fields" class="fields" style="margin-top: 22px" hidden>
                                <div class="field full">
                                    <label for="street">Street address</label>
                                    <input id="street" name="street" autocomplete="street-address">
                                    <p class="error" id="street-error"></p>
                                </div>
                                <div class="field">
                                    <label for="city">Town</label>
                                    <input id="city" name="city" autocomplete="address-level2">
                                    <p class="error" id="city-error"></p>
                                </div>
                                <div class="field" id="state-field">
                                    <label for="state">State</label>
                                    <select id="state" name="state" autocomplete="address-level1"></select>
                                </div>
                                <div class="field">
                                    <label for="zip">ZIP</label>
                                    <input id="zip" name="zip" autocomplete="postal-code" inputmode="numeric" maxlength="5">
                                    <p class="error" id="zip-error"></p>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="card" aria-labelledby="h-contact">
                        <div class="card-body">
                            <h2 id="h-contact">Contact</h2>
                            <div class="fields">
                                <div class="field full">
                                    <label for="name">Name</label>
                                    <input id="name" name="name" autocomplete="name" required>
                                    <p class="error" id="name-error"></p>
                                </div>
                                <div class="field">
                                    <label for="email">Email</label>
                                    <input id="email" name="email" type="email" autocomplete="email" required>
                                    <p class="error" id="email-error"></p>
                                </div>
                                <div class="field">
                                    <label for="phone">Phone <small>(optional)</small></label>
                                    <input id="phone" name="phone" type="tel" autocomplete="tel">
                                </div>
                            </div>
                            <label class="optin">
                                <input type="checkbox" id="news" name="news">
                                <span>Email me when a new harvest is ready. Unsubscribe anytime.</span>
                            </label>
                        </div>
                    </section>

                    <section class="card" aria-labelledby="h-pay">
                        <div class="card-body">
                            <h2 id="h-pay">Payment</h2>
                            <div class="express">
                                <button class="pay-btn apple" type="button" data-wallet="Apple Pay" aria-label="Pay with Apple Pay"><svg viewBox="0 0 17 20" aria-hidden="true"><path fill="currentColor" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 2 5.8 1.1 7.4c-1.9 3.2-.5 8 1.3 10.6.9 1.3 1.9 2.7 3.3 2.6 1.3-.1 1.8-.9 3.4-.9s2 .9 3.4.8c1.4 0 2.3-1.3 3.2-2.6 1-1.5 1.4-2.9 1.4-3-.1 0-2.9-1.1-3-4.3zM11.6 2.9c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.5-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.4z"/></svg>Pay</button>
                                <button class="pay-btn google" type="button" data-wallet="Google Pay" aria-label="Pay with Google Pay"><svg viewBox="0 0 20 20" aria-hidden="true"><path fill="#4285F4" d="M19.6 10.2c0-.7-.1-1.4-.2-2H10v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#34A853" d="M10 20c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H1.1v2.6A10 10 0 0 0 10 20z"/><path fill="#FBBC05" d="M4.4 12a6 6 0 0 1 0-3.9V5.5H1.1a10 10 0 0 0 0 9z"/><path fill="#EA4335" d="M10 4c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 1.1 5.5l3.3 2.6C5.2 5.8 7.4 4 10 4z"/></svg>Pay</button>
                            </div>
                            <div class="or">or pay with card</div>
                            <div class="card-element">
                                <label class="num">
                                    <span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Card number</span>
                                    <input id="card" inputmode="numeric" autocomplete="cc-number" value="4242 4242 4242 4242" aria-describedby="card-error">
                                    <span class="brand-mark" aria-hidden="true">VISA</span>
                                </label>
                                <div class="row">
                                    <input id="exp" aria-label="Expiration date (MM / YY)" autocomplete="cc-exp" value="12 / 34" aria-describedby="card-error">
                                    <input id="cvc" aria-label="Security code" inputmode="numeric" autocomplete="cc-csc" value="123" aria-describedby="card-error">
                                </div>
                            </div>
                            <p class="error card-error" id="card-error"></p>
                            <p class="secure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Payments processed by Stripe</p>
                            <button class="btn btn-dark btn-lg pay-now" type="submit" id="pay-now">Pay</button>
                            <p class="demo-note">Demo: no card is charged.</p>
                        </div>
                    </section>
                </div>

                <aside class="card summary" aria-labelledby="h-summary">
                    <div class="card-body">
                        <h2 id="h-summary">Your order</h2>
                        <ul class="summary-lines" id="lines"></ul>
                        <a class="edit-link" href="../../refined/#order" data-home-shop>Edit cart</a>
                        <div class="totals">
                            <div><span>Subtotal</span><span id="subtotal"></span></div>
                            <div><span id="fee-label">Delivery</span><span id="fee"></span></div>
                            <div class="grand"><span>Total</span><b id="total"></b></div>
                        </div>
                    </div>
                </aside>
            </form>
        </div>
    </main>

    <script src="../../store.js"></script>
    <script src="../shop.js"></script>
    <script>
        (function () {
            const B = Bogabee, S = B.shop;
            const form = document.getElementById('checkout');
            const $ = id => document.getElementById(id);

            // Links back to the homepage variant the visitor shopped on.
            document.querySelectorAll('[data-home]').forEach(a => a.href = S.home());
            document.querySelectorAll('[data-home-shop]').forEach(a => a.href = S.home() + '#order');

            function showEmpty() {
                form.hidden = true;
                $('page-title').textContent = 'Your cart is empty.';
                document.querySelector('.empty-cart').hidden = false;
            }

            // Jars can sell out while a cart waits (another tab, the porch cabinet). Trim to what's left.
            function trimToStock() {
                const short = [];
                for (const i of B.cart.items()) {
                    const left = S.available(i.id);
                    if (i.qty > left) { short.push({ p: B.product(i.id), left }); B.cart.set(i.id, left); }
                }
                if (!short.length) return true;
                $('stock-notice').textContent = short.map(({ p, left }) => left ? `Only ${left} ${p.name} ${left === 1 ? 'jar' : 'jars'} left.` : `${p.name} is sold out.`).join(' ') + ' We updated your cart.';
                $('stock-notice').hidden = false;
                return false;
            }
            trimToStock();
            if (B.cart.count() === 0) { showEmpty(); return; }
            form.hidden = false;

            const STATES = ['AL','AK','AZ','AR','CA','CO','CT','DE','DC','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];
            $('state').innerHTML = STATES.map(st => `<option${st === 'NJ' ? ' selected' : ''}>${st}</option>`).join('');

            // Delivery options.
            $('fulfillment').innerHTML = Object.entries(B.FULFILLMENT).map(([key, f], i) => `
                <label class="choice">
                    <input type="radio" name="fulfillment" value="${key}" ${i === 0 ? 'checked' : ''}>
                    <b>${f.label}</b><span>${f.detail}</span><em>${f.fee ? B.money(f.fee) : 'Free'}</em>
                </label>`).join('');

            // Pickup days: today and the next six. After 8 PM, tomorrow is the default.
            const today = new Date();
            const lateToday = today.getHours() >= 20;
            $('days').innerHTML = Array.from({ length: 7 }, (_, i) => {
                const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
                const label = i === 0 ? 'Today' : d.toLocaleDateString('en-US', { weekday: 'short' });
                return `<label class="day"><input type="radio" name="day" value="${S.isoDay(d)}" ${i === (lateToday ? 1 : 0) ? 'checked' : ''}><span>${label}</span><b>${d.getDate()}</b></label>`;
            }).join('');

            // Hourly start times, 7 AM to 8 PM. Today starts at the current hour, even after 8 PM.
            function renderHours() {
                const day = form.day.value;
                const isToday = day === S.isoDay(today);
                const first = isToday ? Math.max(7, today.getHours()) : 7;
                const prev = Number($('hour').value);
                const hours = [];
                for (let h = first; h <= Math.max(20, first); h++) hours.push(h);
                $('hour').innerHTML = hours.map(h => {
                    const label = isToday && h === today.getHours() ? 'Now' : new Date(2000, 0, 1, h).toLocaleTimeString('en-US', { hour: 'numeric' });
                    return `<option value="${h}">${label}</option>`;
                }).join('');
                if (hours.includes(prev)) $('hour').value = prev;
                renderWindow();
            }
            function renderWindow() {
                const fake = { pickup: { day: form.day.value, hour: Number($('hour').value) } };
                $('window-text').textContent = `Code works once, until ${S.fmtDay(S.pickupWindow(fake).to)}, ${S.fmtTime(S.pickupWindow(fake).to)}`;
            }

            function fulfillment() { return form.fulfillment.value; }

            function render() {
                const f = fulfillment();
                $('porch-fields').hidden = f !== 'porch';
                $('address-fields').hidden = f === 'porch';
                // Local delivery stays in New Jersey; shipping asks for the state.
                $('state-field').hidden = f !== 'ship';
                const items = B.cart.items();
                $('lines').innerHTML = items.map(i => {
                    const p = B.product(i.id);
                    return `<li><img src="${B.photo(p.img, 640)}" alt="" width="56" height="68"><div><b>${i.qty} × ${p.name}</b><span>${p.size}</span></div><span>${B.money(p.price * i.qty)}</span></li>`;
                }).join('');
                const sub = B.cart.subtotal(), fee = B.FULFILLMENT[f].fee;
                $('subtotal').textContent = B.money(sub);
                $('fee-label').textContent = B.FULFILLMENT[f].label;
                $('fee').textContent = fee ? B.money(fee) : 'Free';
                $('total').textContent = B.money(sub + fee);
                $('pay-now').textContent = `Pay ${B.money(sub + fee)}`;
            }

            // Clear a field's error as soon as it's edited.
            form.addEventListener('input', e => {
                if (e.target.getAttribute('aria-invalid') !== 'true') return;
                if (['card', 'exp', 'cvc'].includes(e.target.id)) e.target.setAttribute('aria-invalid', 'false');
                else setError(e.target.id, '');
            });

            // Keep what's been typed if the page reloads before paying.
            const SAVED = 'bogabee-checkout-form';
            const KEEP = ['name', 'email', 'phone', 'street', 'city', 'state', 'zip'];
            try {
                const saved = JSON.parse(sessionStorage.getItem(SAVED)) || {};
                KEEP.forEach(k => { if (saved[k]) $(k).value = saved[k]; });
                if (saved.news) $('news').checked = true;
                if (saved.fulfillment && form.querySelector(`[name=fulfillment][value="${saved.fulfillment}"]`)) form.querySelector(`[name=fulfillment][value="${saved.fulfillment}"]`).checked = true;
            } catch (e) {}
            form.addEventListener('input', save);
            form.addEventListener('change', save);
            function save() {
                const data = Object.fromEntries(KEEP.map(k => [k, $(k).value]));
                data.news = $('news').checked;
                data.fulfillment = fulfillment();
                sessionStorage.setItem(SAVED, JSON.stringify(data));
            }

            form.addEventListener('change', e => {
                if (e.target.name === 'day') renderHours();
                if (e.target.name === 'hour') renderWindow();
                render();
            });

            function setError(id, msg) {
                $(id).setAttribute('aria-invalid', msg ? 'true' : 'false');
                $(id + '-error').textContent = msg;
                return !msg;
            }
            function zipError() {
                const zip = $('zip').value.trim();
                if (!/^\d{5}$/.test(zip)) return 'Enter a 5-digit ZIP.';
                if (fulfillment() === 'local' && !B.DELIVERY_ZIPS[zip]) return `We don’t deliver to ${zip} yet. Choose Shipping instead.`;
                return '';
            }
            function cardOk(card) {
                if (!card) return true;
                const errs = S.cardErrors({ number: $('card').value, exp: $('exp').value, cvc: $('cvc').value });
                ['number', 'exp', 'cvc'].forEach((k, i) => $(['card', 'exp', 'cvc'][i]).setAttribute('aria-invalid', errs[k] ? 'true' : 'false'));
                $('card-error').textContent = Object.values(errs).join(' ');
                return !Object.keys(errs).length;
            }
            function validate(card) {
                const needAddress = fulfillment() !== 'porch';
                const checks = [
                    setError('name', $('name').value.trim() ? '' : 'Enter your name.'),
                    setError('email', /^\S+@\S+\.\S+$/.test($('email').value.trim()) ? '' : 'Enter an email for your receipt and pickup code.'),
                    !needAddress || setError('street', $('street').value.trim() ? '' : 'Enter a street address.'),
                    !needAddress || setError('city', $('city').value.trim() ? '' : 'Enter the town.'),
                    !needAddress || setError('zip', zipError()),
                    cardOk(card),
                ];
                const firstBad = form.querySelector('[aria-invalid="true"]');
                if (firstBad) firstBad.focus();
                return checks.every(Boolean);
            }

            function place(method) {
                // Last check against stock before taking payment (production repeats this on the server).
                if (!trimToStock()) {
                    form.querySelectorAll('button').forEach(b => b.disabled = false);
                    $('pay-now').removeAttribute('aria-busy');
                    if (B.cart.count() === 0) { showEmpty(); return; }
                    render();
                    $('stock-notice').focus();
                    return;
                }
                const f = fulfillment();
                const items = B.cart.items().map(i => ({ id: i.id, qty: i.qty, price: B.product(i.id).price }));
                const subtotal = B.cart.subtotal(), fee = B.FULFILLMENT[f].fee;
                const order = B.orders.create({
                    items, fulfillment: f, subtotal, fee, total: subtotal + fee, method, source: 'web',
                    customer: { name: $('name').value.trim(), email: $('email').value.trim(), phone: $('phone').value.trim() },
                    address: f === 'porch' ? null : { street: $('street').value.trim(), city: $('city').value.trim(), state: f === 'ship' ? $('state').value : 'NJ', zip: $('zip').value.trim() },
                    pickup: f === 'porch' ? { day: form.day.value, hour: Number($('hour').value) } : undefined,
                    // Only an explicit tick subscribes them to Harvest news in HubSpot.
                    news: $('news').checked,
                });
                B.cart.clear();
                sessionStorage.removeItem(SAVED);
                location.href = '../order/?id=' + encodeURIComponent(order.id);
            }

            function busy(btn, label) {
                form.querySelectorAll('button').forEach(b => b.disabled = true);
                btn.setAttribute('aria-busy', 'true');
                btn.textContent = label;
            }

            form.addEventListener('submit', e => {
                e.preventDefault();
                if (!validate(true)) return;
                busy($('pay-now'), 'Processing…');
                setTimeout(() => place('Visa •••• ' + $('card').value.replace(/\D/g, '').slice(-4)), 900);
            });
            // Wallets share the customer's name and email in production; the demo still asks for them here.
            form.querySelectorAll('[data-wallet]').forEach(btn => btn.addEventListener('click', () => {
                if (!validate()) return;
                busy(btn, 'Processing…');
                setTimeout(() => place(btn.dataset.wallet), 900);
            }));

            renderHours();
            render();
        })();
    </script>
    <script src="../../nav.js"></script>
    <script src="../../assets/bee2.js"></script>
</body>
</html>
