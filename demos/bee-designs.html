<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee Cursor Designs — Bogabee Apiaries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'DM Serif Display', serif; }
        .bg-honey { background-color: #fff9eb; }

        /* Active bee styles */
        .bee {
            position: fixed;
            top: 0; left: 0;
            z-index: 9999;
            pointer-events: none;
            will-change: transform;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            contain: layout style;
        }
        @keyframes wing-flap-l {
            0%, 100% { transform: rotate(-5deg) scaleY(1); }
            50% { transform: rotate(-20deg) scaleY(0.7); }
        }
        @keyframes wing-flap-r {
            0%, 100% { transform: rotate(5deg) scaleY(1); }
            50% { transform: rotate(20deg) scaleY(0.7); }
        }
        .bee .wing-l { animation: wing-flap-l 0.035s ease-in-out infinite; transform-origin: 18px 16px; }
        .bee .wing-r { animation: wing-flap-r 0.035s ease-in-out infinite; transform-origin: 30px 16px; }

        /* Sparkle trail */
        @keyframes sparkle-fade { 0% { opacity: 0.8; transform: scale(1); } 100% { opacity: 0; transform: scale(0.2); } }
        .sparkle { position: fixed; pointer-events: none; z-index: 9998; animation: sparkle-fade 0.6s ease-out forwards; }

        /* Pollen trail */
        @keyframes pollen-fall { 0% { opacity: 0.7; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(30px) scale(0.3); } }
        .pollen { position: fixed; pointer-events: none; z-index: 9998; animation: pollen-fall 1.2s ease-out forwards; }

        /* Controls */
        .carousel-controls {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10000;
            display: flex; align-items: center; gap: 12px;
            background: rgba(15,23,42,0.95); backdrop-filter: blur(12px);
            padding: 8px 12px 8px 16px; border-radius: 9999px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
        }
        .carousel-controls button {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.1); color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .carousel-controls button:hover { background: rgba(245,158,11,0.8); }
        .carousel-controls button:disabled { opacity: 0.3; cursor: default; background: transparent; }
        .carousel-controls .label { color: white; font-size: 13px; font-weight: 600; min-width: 220px; text-align: center; }
        .carousel-controls .counter { color: rgba(255,255,255,0.4); font-size: 11px; font-weight: 500; }

        /* Preview card */
        .preview-card {
            width: 140px; height: 140px;
            background: white; border-radius: 1rem; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            display: flex; align-items: center; justify-content: center;
            border: 2px solid transparent; transition: all 0.2s;
        }
        .preview-card.active { border-color: #f59e0b; box-shadow: 0 4px 20px rgba(245,158,11,0.2); }
        .preview-card:hover { transform: scale(1.05); cursor: pointer; }
    </style>
</head>

                <rect x="6" y="3" width="1" height="1" fill="#555"/><rect x="9" y="3" width="1" height="1" fill="#555"/>
                <rect x="2" y="4" width="3" height="3" fill="rgba(255,255,255,0.7)"/><rect x="11" y="4" width="3" height="3" fill="rgba(255,255,255,0.7)"/>
                <rect x="4" y="4" width="8" height="3" fill="#6b4423"/>
                <rect x="3" y="7" width="10" height="2" fill="#fbbf24"/>
                <rect x="3" y="9" width="10" height="2" fill="#1c1917"/>
                <rect x="3" y="11" width="10" height="2" fill="#fbbf24"/>
                <rect x="3" y="13" width="10" height="2" fill="#1c1917"/>
                <rect x="4" y="15" width="8" height="2" fill="#fbbf24"/>
                <rect x="5" y="17" width="6" height="1" fill="#fbbf24"/>
                <rect x="7" y="18" width="2" height="2" fill="#1c1917"/>
            </svg>`,
            trail: null
        },
        {
            name: "Flat Modern",
            desc: "Clean flat design, no gradients — modern & crisp",
            size: { w: 26, h: 30 },
            svg: `<svg viewBox="0 0 48 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path class="wing-l" d="M17 17 Q6 11 4 5 Q2 0 9 3 Q16 7 20 15 Z" fill="#e0f2fe" stroke="#93c5fd" stroke-width="0.8"/>
                <path class="wing-r" d="M31 17 Q42 11 44 5 Q46 0 39 3 Q32 7 28 15 Z" fill="#e0f2fe" stroke="#93c5fd" stroke-width="0.8"/>
                <ellipse cx="24" cy="36" rx="11" ry="12" fill="#fbbf24"/>
                <rect x="13" y="28" width="22" height="4" rx="1" fill="#1c1917"/>
                <rect x="13" y="36" width="22" height="3.5" rx="1" fill="#1c1917"/>
                <rect x="15" y="43" width="18" height="3" rx="1" fill="#1c1917"/>
                <ellipse cx="24" cy="20" rx="9" ry="7.5" fill="#44403c"/>
                <circle cx="24" cy="9" r="5.5" fill="#1c1917"/>
                <circle cx="20" cy="8" r="2" fill="#fbbf24"/><circle cx="28" cy="8" r="2" fill="#fbbf24"/>
                <path d="M20 3.5 Q17 1 13 2" stroke="#1c1917" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                <path d="M28 3.5 Q31 1 35 2" stroke="#1c1917" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                <circle cx="13" cy="2" r="1.5" fill="#fbbf24"/><circle cx="35" cy="2" r="1.5" fill="#fbbf24"/>
            </svg>`,
            trail: null
        },
        {
            name: "Honeycomb Bee",
            desc: "Hexagonal pattern on body — geometric & branded",
            size: { w: 28, h: 32 },
            svg: `<svg viewBox="0 0 48 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path class="wing-l" d="M17 17 Q4 10 2 4 Q0 -2 8 2 Q16 6 20 15 Z" fill="rgba(255,255,255,0.8)" stroke="#d4a012" stroke-width="0.5"/>
                <path class="wing-r" d="M31 17 Q44 10 46 4 Q48 -2 40 2 Q32 6 28 15 Z" fill="rgba(255,255,255,0.8)" stroke="#d4a012" stroke-width="0.5"/>
                <ellipse cx="24" cy="36" rx="11" ry="12" fill="#f59e0b"/>
                <polygon points="20,30 22,28 26,28 28,30 26,32 22,32" fill="#d97706" stroke="#92400e" stroke-width="0.5"/>
                <polygon points="16,34 18,32 22,32 24,34 22,36 18,36" fill="#d97706" stroke="#92400e" stroke-width="0.5"/>
                <polygon points="24,34 26,32 30,32 32,34 30,36 26,36" fill="#d97706" stroke="#92400e" stroke-width="0.5"/>
                <polygon points="20,38 22,36 26,36 28,38 26,40 22,40" fill="#d97706" stroke="#92400e" stroke-width="0.5"/>
                <polygon points="16,42 18,40 22,40 24,42 22,44 18,44" fill="#d97706" stroke="#92400e" stroke-width="0.5"/>
                <polygon points="24,42 26,40 30,40 32,42 30,44 26,44" fill="#d97706" stroke="#92400e" stroke-width="0.5"/>
                <ellipse cx="24" cy="20" rx="9" ry="7.5" fill="#5c3a1e"/>
                <circle cx="24" cy="9" r="5.5" fill="#1c1917"/>
                <ellipse cx="19" cy="8" rx="2.2" ry="2.8" fill="#0f0d0a"/><ellipse cx="29" cy="8" rx="2.2" ry="2.8" fill="#0f0d0a"/>
                <path d="M20 3.5 Q17 1 13 2" stroke="#1c1917" stroke-width="1.3" stroke-linecap="round" fill="none"/>
                <path d="M28 3.5 Q31 1 35 2" stroke="#1c1917" stroke-width="1.3" stroke-linecap="round" fill="none"/>
                <path d="M24 48 L24 53" stroke="#1c1917" stroke-width="1.8" stroke-linecap="round"/>
            </svg>`,
            trail: null
        }
    ];

    let current = 0;
    let beeEl = null;
    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    let beeX = mouseX, beeY = mouseY, prevBeeX = beeX, prevBeeY = beeY, angle = 0;
    let trailType = null;
    let lastTrailTime = 0;
    const s1 = Math.random()*100, s2 = Math.random()*100, s3 = Math.random()*100;
    let lastMouseMoveTime = Date.now();
    let isFlyingAway = false, isOffScreen = false;
    let flyAwayTargetX = 0, flyAwayTargetY = 0;
    let isCrossing = false, crossTargetX = 0, crossTargetY = 0, crossEndTime = 0, nextCrossCheck = Date.now() + 4000;

    document.addEventListener('mousemove', e => {
        mouseX = e.clientX; mouseY = e.clientY;
        lastMouseMoveTime = Date.now();
        if (isFlyingAway || isOffScreen) {
            isFlyingAway = false; isOffScreen = false;
            const edge = Math.floor(Math.random()*4);
            if (edge===0){beeX=-50;beeY=Math.random()*window.innerHeight}
            else if(edge===1){beeX=window.innerWidth+50;beeY=Math.random()*window.innerHeight}
            else if(edge===2){beeX=Math.random()*window.innerWidth;beeY=-50}
            else{beeX=Math.random()*window.innerWidth;beeY=window.innerHeight+50}
        }
    }, {passive:true});

    function spawnTrail(x, y, type) {
        if (type === 'sparkle') {
            const el = document.createElement('div');
            el.className = 'sparkle';
            const size = 3 + Math.random() * 5;
            el.style.cssText = `left:${x + (Math.random()-0.5)*20}px;top:${y + (Math.random()-0.5)*20}px;width:${size}px;height:${size}px;background:#fbbf24;border-radius:50%;`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 600);
        } else if (type === 'pollen') {
            const el = document.createElement('div');
            el.className = 'pollen';
            const size = 3 + Math.random() * 4;
            el.style.cssText = `left:${x + (Math.random()-0.5)*16}px;top:${y}px;width:${size}px;height:${size}px;background:${Math.random()>0.5?'#fbbf24':'#f59e0b'};border-radius:50%;`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }
    }

    function animate(now) {
        const t = now * 0.001;
        if (!isFlyingAway && !isOffScreen && Date.now() - lastMouseMoveTime > 6000) {
            isFlyingAway = true;
            const fa = Math.random()*Math.PI*2;
            const dist = Math.max(window.innerWidth,window.innerHeight)+100;
            flyAwayTargetX = beeX+Math.cos(fa)*dist; flyAwayTargetY = beeY+Math.sin(fa)*dist;
        }
        if (isFlyingAway && (beeX<-60||beeX>window.innerWidth+60||beeY<-60||beeY>window.innerHeight+60)) {
            isOffScreen = true; isFlyingAway = false;
        }
        let targetX, targetY, ease;
        if (isOffScreen) { requestAnimationFrame(animate); return; }
        else if (isFlyingAway) { targetX=flyAwayTargetX; targetY=flyAwayTargetY; ease=0.008; }
        else if (!isCrossing && now > nextCrossCheck && Math.random() < 0.25) {
            isCrossing=true; crossTargetX=mouseX*2-beeX+(Math.random()-0.5)*100;
            crossTargetY=mouseY*2-beeY+(Math.random()-0.5)*100;
            crossEndTime=now+600+Math.random()*500; nextCrossCheck=now+4000+Math.random()*6000;
            targetX=crossTargetX; targetY=crossTargetY; ease=0.055;
        } else if (isCrossing) {
            targetX=crossTargetX; targetY=crossTargetY; ease=0.055;
            if (now>crossEndTime) isCrossing=false;
        } else {
            const baseDist=75, distVar=25, dist=baseDist+Math.sin(t*0.2)*distVar;
            const swayX=Math.sin(t*0.6+s1)*0.7+Math.sin(t*0.25+s2)*0.5;
            const swayY=Math.sin(t*0.45+s2)*0.6+Math.cos(t*0.15+s3)*0.4;
            targetX=mouseX+swayX*dist; targetY=mouseY+swayY*dist; ease=0.035;
        }
        beeX+=(targetX-beeX)*ease; beeY+=(targetY-beeY)*ease;
        const dx=beeX-prevBeeX, dy=beeY-prevBeeY;
        const distToMouse=Math.sqrt((beeX-mouseX)**2+(beeY-mouseY)**2);
        let targetAngle=angle;
        if (isFlyingAway||isCrossing||distToMouse>120) { if(dx*dx+dy*dy>0.5) targetAngle=Math.atan2(dy,dx)*57.29+90; }
        else { targetAngle=Math.atan2(mouseY-beeY,mouseX-beeX)*57.29+90; }
        prevBeeX=beeX; prevBeeY=beeY;
        let angleDiff=targetAngle-angle; while(angleDiff>180)angleDiff-=360; while(angleDiff<-180)angleDiff+=360;
        angle+=angleDiff*0.08;
        const wobbleX=Math.sin(t*11)*1.5, wobbleY=Math.cos(t*13)*1.5;
        if (beeEl) beeEl.style.transform=`translate3d(${beeX+wobbleX}px,${beeY+wobbleY}px,0) rotate(${angle}deg)`;

        // Trail
        if (trailType && now - lastTrailTime > 60) {
            spawnTrail(beeX, beeY, trailType);
            lastTrailTime = now;
        }

        requestAnimationFrame(animate);
    }

    function renderBee(index) {
        const design = beeDesigns[index];
        if (beeEl) beeEl.remove();
        beeEl = document.createElement('div');
        beeEl.className = 'bee';
        beeEl.style.width = design.size.w + 'px';
        beeEl.style.height = design.size.h + 'px';
        beeEl.style.marginLeft = (-design.size.w/2) + 'px';
        beeEl.style.marginTop = (-design.size.h/2) + 'px';
        beeEl.innerHTML = design.svg;
        document.body.appendChild(beeEl);
        trailType = design.trail;

        document.getElementById('bee-label').textContent = `${index+1} — ${design.name}`;
        document.getElementById('bee-counter').textContent = `${index+1} / ${beeDesigns.length} · ${design.desc}`;
        document.getElementById('btn-prev').disabled = index === 0;
        document.getElementById('btn-next').disabled = index === beeDesigns.length - 1;

        // Update preview grid
        document.querySelectorAll('.preview-card').forEach((card, i) => {
            card.classList.toggle('active', i === index);
        });
    }

    function buildPreviewGrid() {
        const grid = document.getElementById('preview-grid');
        beeDesigns.forEach((design, i) => {
            const card = document.createElement('div');
            card.className = 'preview-card' + (i === 0 ? ' active' : '');
            card.innerHTML = `<div style="width:${design.size.w * 1.8}px;height:${design.size.h * 1.8}px">${design.svg}</div>`;
            card.onclick = () => { current = i; renderBee(i); };
            const label = document.createElement('p');
            label.className = 'text-xs text-slate-500 text-center mt-2 font-medium';
            label.textContent = design.name;
            const wrap = document.createElement('div');
            wrap.className = 'flex flex-col items-center';
            wrap.appendChild(card);
            wrap.appendChild(label);
            grid.appendChild(wrap);
        });
    }

    function prevBee() { if (current > 0) { current--; renderBee(current); } }
    function nextBee() { if (current < beeDesigns.length - 1) { current++; renderBee(current); } }
    document.addEventListener('keydown', e => { if (e.key==='ArrowLeft') prevBee(); if (e.key==='ArrowRight') nextBee(); });

    buildPreviewGrid();
    renderBee(0);
    requestAnimationFrame(animate);
    </script>
