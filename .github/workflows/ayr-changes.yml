name: AYR changes

# Pull requests only. Lints every change file, needs one when the pull request
# changes what ships, and refuses edits to what the release writes:
# PATCH_NOTES.md, the history page and other pull requests' change files. Uses no secrets and talks to no outside service.

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the diff against the base branch has a merge base.
          fetch-depth: 0
      # The kit is TypeScript that Node runs directly (Node 22.18+).
      - uses: actions/setup-node@v7
        with:
          node-version: '^24.22.1'
          check-latest: true
      # No lockfile is vendored: ayr/package.json pins exact versions. The
      # check needs no browser, so the optional playwright-core is left out.
      - name: Install the kit's dependencies
        run: npm install --prefix ayr --omit=dev --omit=optional --no-save --no-audit --no-fund
      - name: Check the change files and the pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node ayr/bin/ayr.ts check --pr "origin/$BASE_REF"
