<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee lab | Bogabee Apiaries</title>
    <meta name="description" content="The Bogabee bee: our pick and ten more ways it could behave, each playing its trick live.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Bee lab | Bogabee Apiaries">
    <meta property="og:description" content="The Bogabee bee: our pick and ten more ways it could behave, each playing its trick live.">
    <meta property="og:image" content="/demos/assets/og.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="../assets/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..500;1,9..144,400..500&family=Jost:wght@400..600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../brand.css">
    <style>
        main { padding: 132px 0 120px; }
        .top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 20px; }
        .top h1 { font-size: clamp(48px, 6.4vw, 92px); margin-top: 14px; }
        .top p { margin: 14px 0 0; color: var(--muted); max-width: 44ch; font-size: 18px; }
        .pause { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border: 0; border-radius: 999px; background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font: 500 15px/1 var(--sans); cursor: pointer; }
        .pause:hover { box-shadow: inset 0 0 0 1px var(--brown); }
        .pause svg { width: 16px; height: 16px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; margin-top: 40px; }
        .card { display: grid; grid-template-rows: auto 1fr; border-radius: 20px; background: var(--paper); box-shadow: 0 1px 0 var(--line); overflow: hidden; transition: box-shadow .3s; }
        .card[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--gold), 0 14px 30px -22px rgb(36 24 14 / .5); }
        .card .body { display: grid; grid-template-rows: auto auto 1fr auto; gap: 6px; padding: 16px 18px 18px; }
        .card .num { font: 500 12px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--amber-text); }
        .card.pick { grid-column: 1 / -1; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); grid-template-rows: none; box-shadow: inset 0 0 0 2px var(--gold), 0 1px 0 var(--line); }
        .card.pick .stage { height: 320px; border-bottom: 0; border-right: 1px solid var(--line); }
        .card.pick .body { align-content: center; padding: 28px; }
        .card.pick h2 { font-size: 40px; }
        @media (max-width: 760px) { .card.pick { grid-template-columns: minmax(0, 1fr); } .card.pick .stage { height: 260px; border-right: 0; border-bottom: 1px solid var(--line); } }
        .card h2 { margin: 0; font: italic 400 26px/1.1 var(--display); }
        .card p { margin: 0; font-size: 15px; color: var(--muted); }
        .card .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .card .btn { padding: 9px 16px; font-size: 14px; }
        .card .site { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
        .card .site:hover { box-shadow: inset 0 0 0 1px var(--brown); background: transparent; }
        .card[aria-current="true"] .fly { background: var(--ink); color: var(--cream); }

        /* ---------- Stages: each variation plays its own scene ---------- */
        .stage {
            position: relative;
            height: 230px;
            overflow: hidden;
            background:
                radial-gradient(circle at 1px 1px, rgb(86 54 33 / .1) 1px, transparent 1.5px) 0 0 / 18px 18px,
                #fbf3df;
            border-bottom: 1px solid var(--line);
            user-select: none;
        }
        .stage .caption {
            position: absolute;
            z-index: 4;
            left: 10px;
            bottom: 10px;
            padding: 5px 10px;
            border-radius: 99px;
            background: rgb(255 253 247 / .9);
            font-size: 12px;
            color: var(--brown);
            box-shadow: 0 1px 0 var(--line);
            transition: opacity .3s;
        }
        .ghost { position: absolute; z-index: 5; left: 0; top: 0; width: 20px; height: 24px; pointer-events: none; }
        .ghost svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 2px 2px rgb(0 0 0 / .25)); }
        .ghost::after { content: ""; position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--honey); opacity: 0; }
        .ghost.click::after { animation: ring .5s ease-out; }
        @keyframes ring { from { opacity: 1; scale: .3; } to { opacity: 0; scale: 1.4; } }
        .mini { position: absolute; display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 99px; font: 500 12px/1 var(--sans); background: var(--ink); color: var(--cream); }
        .mini.gold { background: var(--gold); color: var(--brown); }
        .mini-card { position: absolute; left: 18px; top: 22px; width: 104px; padding: 6px; border-radius: 14px; background: var(--paper); box-shadow: 0 10px 20px -14px rgb(36 24 14 / .5); }
        .mini-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }
        .mini-card .mini { position: static; width: 100%; justify-content: center; margin-top: 6px; }
        .mini-cart { position: absolute; right: 16px; top: 16px; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--gold); color: var(--brown); }
        .mini-cart svg { width: 20px; height: 20px; }
        .mini-cart b { position: absolute; right: -4px; top: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--ink); color: var(--cream); font: 600 11px/18px var(--sans); text-align: center; }
        .mini-photo { position: absolute; width: 92px; height: 70px; border-radius: 10px; object-fit: cover; }
        .page { position: absolute; inset: 0; padding: 18px 22px; display: grid; gap: 12px; align-content: start; }
        .page i { display: block; height: 10px; border-radius: 5px; background: rgb(86 54 33 / .1); }
        .page i:nth-child(4n) { width: 60%; }
        .page i:nth-child(5n) { height: 46px; background: rgb(244 211 74 / .35); }
    </style>
</head>
<body>
    <header class="nav is-solid">
        <div class="wrap">
            <a class="brand" href="../" aria-label="Bogabee Apiaries, home"><img src="../assets/img/logo-96.webp" width="42" height="42" alt=""><span>Bogabee Apiaries</span></a>
            <nav class="links" aria-label="Demo">
                <a href="../">Showcase</a>
                <a class="btn" href="../refined/">Open the site</a>
            </nav>
        </div>
    </header>

    <main class="wrap">
        <div class="top">
            <div>
                <span class="eyebrow">Bee lab</span>
                <h1 class="display">Pick a bee.</h1>
                <p>Our pick up top, then ten more. Each card plays its bee's trick on a loop.</p>
            </div>
            <button class="pause" type="button" id="pause" aria-pressed="false"></button>
        </div>
        <div class="grid" id="cards"></div>
    </main>

    <script>window.BOGABEE_BEE_MANUAL = true;</script>
    <script src="../nav.js"></script>
    <script src="../assets/bee2.js"></script>
    <script>
        const { VARIANTS, start, stop, stage } = window.BogabeeBee;
        const IMG = '../../assets/';
        const BAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2A2 2 0 0 1 15.8 21H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg>';
        const GHOST = '<span class="ghost"><svg viewBox="0 0 20 24"><path d="M2 1.5v18l5-4.6 3.4 7.4 3-1.4-3.3-7.2h7.1z" fill="#24180e" stroke="#fffdf7" stroke-width="1.5" stroke-linejoin="round"/></svg></span>';

        // The props each scene needs.
        const PROPS = {
            pollinator: `<span class="mini" style="left:26px;top:40px">Add to cart</span><img class="mini-photo" src="${IMG}sunflower.jpg" alt="" style="right:26px;top:110px">`,
            courier: `<div class="mini-card"><img src="${IMG}product16oz.jpg" alt=""><span class="mini gold" data-mini-add>Add</span></div><span class="mini-cart" data-cart-open>${BAG}<b data-count>0</b></span>`,
            bogabee: `<div class="mini-card"><img src="${IMG}product16oz.jpg" alt=""><span class="mini gold" data-mini-add>Add</span></div><span class="mini-cart" data-cart-open>${BAG}<b data-count>0</b></span>`,
            waggle: `<span class="mini gold" data-bee-goal style="right:16px;top:16px">Jars</span>`,
            breeze: `<div class="page">${'<i></i>'.repeat(24)}</div>`,
        };

        const cards = document.getElementById('cards');
        cards.innerHTML = VARIANTS.map((v, i) => `
            <article class="card${v.pick ? ' pick' : ''}" data-id="${v.id}">
                <div class="stage" data-stage="${v.id}" aria-hidden="true">${PROPS[v.id] || ''}${GHOST}<span class="caption"></span></div>
                <div class="body">
                    <span class="num">${v.pick ? 'Our pick' : String(i).padStart(2, '0')}</span>
                    <h2>${v.name}</h2>
                    <p>${v.does}</p>
                    <div class="row">
                        <button class="btn fly" type="button" data-fly="${v.id}">Fly it on this page</button>
                        <a class="btn site" href="../refined/?bee=${v.id}">On the site</a>
                    </div>
                </div>
            </article>`).join('');

        cards.addEventListener('click', e => {
            const b = e.target.closest('[data-fly]');
            if (!b) return;
            const cur = window.BogabeeBee.current;
            if (cur && cur.id === b.dataset.fly) stop(); else start(b.dataset.fly);
        });
        function show(v) {
            const id = v && v.id;
            document.querySelectorAll('.card').forEach(c => c.setAttribute('aria-current', c.dataset.id === id));
            document.querySelectorAll('[data-fly]').forEach(b => {
                const on = b.dataset.fly === id;
                b.textContent = on ? 'Stop flying' : 'Fly it on this page';
                b.setAttribute('aria-pressed', on);
            });
        }
        window.addEventListener('bogabee:bee', e => show(e.detail));
        if (window.BogabeeBee.current) show(window.BogabeeBee.current);

        // ---------- A little director for each stage ----------
        const ease = t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
        // One control pauses every scene. Under reduced motion they start paused.
        let scenesPaused = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const directors = [];
        const pauseBtn = document.getElementById('pause');
        function showPause() {
            pauseBtn.setAttribute('aria-pressed', scenesPaused);
            pauseBtn.innerHTML = scenesPaused
                ? '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>Play the scenes'
                : '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" fill="currentColor"/></svg>Pause the scenes';
        }
        pauseBtn.addEventListener('click', () => { scenesPaused = !scenesPaused; showPause(); directors.forEach(d => d.update()); });
        showPause();

        function director(box, id) {
            const S = stage(box, id);
            const ghost = box.querySelector('.ghost');
            const cap = box.querySelector('.caption');
            let gx = box.clientWidth * .5, gy = box.clientHeight * .5, visible = false, wake = null;
            const running = () => visible && !scenesPaused;
            function update() {
                S.pause(!running());
                if (running() && wake) { wake(); wake = null; }
            }
            new IntersectionObserver(([e]) => { visible = e.isIntersecting; update(); }).observe(box);
            const ready = () => running() ? null : new Promise(r => { wake = r; });
            const W = () => box.clientWidth, H = () => box.clientHeight;
            const place = () => { ghost.style.transform = `translate(${gx - 2}px, ${gy - 2}px)`; };
            const say = text => { cap.textContent = text; cap.style.opacity = text ? 1 : 0; };
            const wait = ms => new Promise(r => setTimeout(r, ms));
            async function go(x, y, ms) {
                await ready();
                const x0 = gx, y0 = gy, t0 = performance.now();
                if (x <= 1 && y <= 1) { x *= W(); y *= H(); }
                await new Promise(done => {
                    (function frame(now) {
                        const p = Math.min(1, (now - t0) / ms);
                        gx = x0 + (x - x0) * ease(p); gy = y0 + (y - y0) * ease(p);
                        place(); S.move(gx, gy);
                        p < 1 ? requestAnimationFrame(frame) : done();
                    })(t0);
                });
            }
            const center = el => { const r = el.getBoundingClientRect(), s = box.getBoundingClientRect(); return [r.left - s.left + r.width / 2, r.top - s.top + r.height / 2]; };
            function click() {
                ghost.classList.remove('click'); void ghost.offsetWidth; ghost.classList.add('click');
                S.down(gx, gy);
            }
            place();
            const d = { S, box, go, wait, say, click, center, ready, W, H, update };
            directors.push(d);
            return d;
        }

        const SCRIPTS = {
            async classic(d) {
                d.say('Moving'); await d.go(.25, .35, 900); await d.go(.7, .6, 900); await d.go(.5, .5, 700);
                d.say('Stopped: it lands beside the pointer'); await d.wait(3200);
            },
            async pollinator(d) {
                const btn = d.box.querySelector('.mini'), photo = d.box.querySelector('.mini-photo');
                d.say('Moving'); await d.go(.5, .5, 700);
                await d.go(...d.center(btn), 700); d.S.hover(btn);
                d.say('Resting on a button: it lands and dusts it'); await d.wait(4200);
                d.S.hover(null); d.say('Moving'); await d.go(.55, .55, 600);
                await d.go(...d.center(photo), 700); d.S.hover(photo);
                d.say('Resting on a photo'); await d.wait(4200); d.S.hover(null);
            },
            async courier(d) {
                const add = d.box.querySelector('[data-mini-add]'), count = d.box.querySelector('[data-count]');
                d.say('Moving'); await d.go(.6, .7, 800);
                await d.go(...d.center(add), 800); await d.wait(250);
                d.say('Add: it carries a jar to the cart'); d.click(); d.S.add(add);
                count.textContent = (Number(count.textContent) + 1) % 10;
                await d.go(.45, .8, 900); await d.wait(6800);
            },
            async bogabee(d) {
                const add = d.box.querySelector('[data-mini-add]'), count = d.box.querySelector('[data-count]');
                d.say('Moving'); await d.go(.6, .65, 800);
                await d.go(...d.center(add), 800); await d.wait(250);
                d.say('Add: it carries the jar into the cart'); d.click(); d.S.add(add);
                count.textContent = (Number(count.textContent) + 1) % 10;
                await d.go(.5, .78, 900); await d.wait(6400);
                d.say('Holding still: it creeps closer, lands and dozes'); await d.go(.55, .6, 600); await d.wait(7000);
                const b = d.S.bee;
                await d.go(Math.max(10, b.x - 170), b.y, 400); await d.wait(150);
                d.say('A fast swipe: it wakes and scoots away'); await d.go(b.x + 30, b.y, 160); await d.wait(2000);
            },
            async waggle(d) {
                d.say('Moving'); await d.go(.3, .55, 800); await d.go(.35, .62, 500);
                d.say('Still: it dances toward the jars'); await d.wait(7500);
            },
            async shy(d) {
                d.say('Holding still: it creeps closer'); await d.go(.5, .5, 700); await d.wait(2600);
                const b = d.S.bee;
                await d.go(Math.max(10, b.x - 160), b.y, 400); await d.wait(150);
                d.say('A fast swipe: it scoots away'); await d.go(b.x + 30, b.y, 160); await d.wait(1600);
            },
            async sleepy(d) {
                d.say('Moving'); await d.go(.35, .5, 800); await d.go(.5, .5, 500);
                d.say('Still: it lands, then dozes'); await d.wait(6200);
                d.say('Move: it wakes with a start'); await d.go(.56, .44, 180); await d.go(.3, .6, 900);
            },
            async breeze(d) {
                const page = d.box.querySelector('.page');
                let y = 0;
                d.say('Moving'); await d.go(.5, .5, 700); await d.wait(800);
                d.say('Scrolling: it gets blown around');
                for (let dir of [1, -1]) {
                    for (let i = 0; i < 8; i++) { y = Math.max(-260, Math.min(0, y - dir * 40)); page.style.transform = `translateY(${y}px)`; d.S.scroll(dir * 40); await d.wait(50); }
                    await d.wait(1800);
                }
            },
            async boop(d) {
                d.say('Moving'); await d.go(.45, .5, 700);
                d.say('Stopped'); await d.wait(2200);
                const b = d.S.bee;
                await d.go(b.x, b.y, 400);
                d.say('Click the bee: a loop'); d.click(); await d.wait(1600);
                await d.go(.2, .3, 500); d.say('Click anywhere: it zips over'); d.click(); await d.wait(1600);
            },
            async pair(d) {
                d.say('Moving in circles');
                for (let a = 0; a < Math.PI * 4; a += Math.PI / 8) await d.go(.5 + Math.cos(a) * .3, .5 + Math.sin(a) * .28, 140);
                d.say('Stopped: they land side by side'); await d.wait(3200);
            },
            async bumble(d) {
                d.say('Sharp turns: slow and wobbly');
                for (const [x, y] of [[.2, .3], [.8, .7], [.2, .7], [.8, .3], [.5, .5]]) await d.go(x, y, 600);
                d.say('Stopped'); await d.wait(2600);
            },
        };

        document.querySelectorAll('[data-stage]').forEach(box => {
            const d = director(box, box.dataset.stage);
            (async () => { for (;;) { await d.ready(); await SCRIPTS[box.dataset.stage](d); } })();
        });
    </script>
</body>
</html>
